<head>
    <meta charset="UTF-8">

    <title>Contact | Tran Duc Minh Portfolio</title>

    <link rel="icon" type="image/png" sizes="16x16" href="../main/kiyeu.jpeg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../main/style.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            /* Màu nền nhẹ cho toàn trang */
            padding-top: 80px;
            /* Tránh nội dung bị menu che mất */
        }

        .contact-card {
            border-radius: 1rem;
            border: none;
            transition: transform 0.3s ease;
        }

        .contact-card:hover {
            transform: translateY(-5px);
        }

        .section-title {
            border-bottom: 3px solid #198754;
            /* Màu xanh lá giống green-400 cũ */
            display: inline-block;
        }

        .nav-link.active {
            font-weight: 600;
            color: #0d6efd !important;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="../main/index.html">
                <img src="../main/kiyeu.jpeg" alt="Avatar Tran Duc Minh" class="rounded-circle" width="40" height="40"
                    style="object-fit: cover;">
                <span class="fw-bold text-dark">Tran Duc Minh</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../main/index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../Experience/index.html">Experience</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../Education/index.html">Education</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../Project/index.html">Project</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../Skills/index.html">Skills</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="../Contact/index.html">Contact</a>
                    </li>
                    <!-- <li class="nav-item">
                        <button class="nav-link btn" onclick="document.body.classList.toggle('dark')">🌙</button>
                    </li> -->
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <section id="contact" class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card contact-card shadow p-4 p-md-5">
                    <div class="card-body">
                        <h2 class="text-3xl fw-bold text-dark mb-4 pb-2 section-title" data-key="contact_title">
                            Contact
                        </h2>

                        <ul class="list-unstyled d-flex flex-column gap-3 text-lg text-secondary">
                            <li class="d-flex align-items-center gap-3">
                                <i class="bi bi-geo-alt-fill text-danger fs-4"></i>
                                <div>
                                    <span class="fw-bold text-dark d-block" data-key="address_label">Address:</span>
                                    <span data-key="address_value">Da Nang, Viet Nam</span>
                                </div>
                            </li>

                            <li class="d-flex align-items-center gap-3">
                                <i class="bi bi-envelope-fill text-warning fs-4"></i>
                                <div>
                                    <span class="fw-bold text-dark d-block" data-key="email_label">Email:</span>
                                    <a href="mailto:trminhlaptrinhvien@gmail.com"
                                        class="text-decoration-none text-primary hover-underline"
                                        data-key="email_value">
                                        trminhlaptrinhvien@gmail.com
                                    </a>
                                </div>
                            </li>

                            <li class="d-flex align-items-center gap-3">
                                <i class="bi bi-facebook text-primary fs-4"></i>
                                <div>
                                    <span class="fw-bold text-dark d-block" data-key="links_label">Social:</span>
                                    <a href="https://facebook.com/TrMinhZz" class="text-decoration-none text-primary"
                                        target="_blank" data-key="links_value">Facebook</a>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
