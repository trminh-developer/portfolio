<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="shortcut icon" type="image/x-icon" sizes="16x16" href="../main/Vest.png">
    <link rel="manifest" href="../manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../main/style.css">

    <style>
        :root {
            --primary-color: #10b981;
            /* Màu xanh chủ đạo */
            --bg-light: #f8f9fa;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: #333;
        }

        /* Navbar Glassmorphism */
        .navbar {
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.9) !important;
        }

        /* Animation xuất hiện */
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Card Education Custom */
        .edu-card {
            border: none;
            border-radius: 16px;
            background: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border-left: 5px solid var(--primary-color);
        }

        .edu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08) !important;
        }

        .school-logo-placeholder {
            width: 60px;
            height: 60px;
            background-color: #e6fffa;
            color: var(--primary-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .badge-year {
            background-color: #ecfdf5;
            color: var(--primary-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        h2.section-title {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            position: relative;
            display: inline-block;
        }

        h2.section-title::after {
            content: '';
            position: absolute;
            width: 50%;
            height: 4px;
            background: var(--primary-color);
            bottom: -8px;
            left: 0;
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
                <img src="../main/Vest.png" alt="Logo" class="rounded-circle"
                    style="height: 40px; width: 40px; object-fit: cover;">
                <span>Tran Duc Minh</span>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto fw-medium">
                    <li class="nav-item">
                        <a class="nav-link" href="../main/index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../Experience/index.html">Experience</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active text-success" href="../Education/index.html">Education</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../Project/index.html">Project</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../Skills/index.html">Skills</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="../Contact/index.html">Contact</a>
                    </li>
                    <!-- <li class="nav-item">
                        <button class="nav-link btn" onclick="document.body.classList.toggle('dark')">🌙</button>
                    </li> -->
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 fade-in-up">

                <div class="mb-5 mt-4">
                    <h2 class="section-title text-3xl text-gray-800" data-key="education_title">Education Journey</h2>
                    <p class="text-muted mt-3">My academic and personal development.</p>
                </div>

                <div class="card edu-card shadow-sm mb-4 p-4">
                    <div class="d-flex flex-column flex-md-row gap-4 align-items-start align-items-md-center">
                        <div class="school-logo-placeholder flex-shrink-0">
                            <i class="bi bi-mortarboard-fill"></i>
                        </div>

                        <div class="flex-grow-1 w-100">
                            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                                <div>
                                    <h3 class="h5 fw-bold mb-1 text-dark" data-key="school">Dong A University</h3>
                                    <p class="text-secondary mb-1 fw-medium">Website Engineer
                                    </p>
                                </div>
                                <span class="badge-year">
                                    <i class="bi bi-calendar3 me-1"></i> 2025 - 2029
                                </span>
                            </div>

                            <hr class="my-3 opacity-10">

                            <ul class="list-unstyled mb-0 text-secondary small">
                                <li class="mb-2 d-flex align-items-start gap-2">
                                    <i class="bi bi-check-circle-fill text-success mt-1"></i>
                                    <span>Target GPA: 3.0/4.0</span>
                                </li>
                                <li class="d-flex align-items-start gap-2">
                                    <i class="bi bi-trophy-fill text-warning mt-1"></i>
                                    <span class="text-success fw-semibold fst-italic" data-key="degree_note">Graduated
                                        with honors (Expected)</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
