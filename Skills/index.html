    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../main/style.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            padding-top: 80px;
        }

        .skill-card {
            border: none;
            border-radius: 1rem;
            transition: all 0.3s ease;
        }

        .skill-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1) !important;
        }

        .section-title {
            border-bottom: 3px solid #198754;
            /* Màu xanh lá */
            display: inline-block;
        }

        .nav-link.active {
            font-weight: 600;
            color: #0d6efd !important;
        }

        /* Style cho từng item kỹ năng */
        .skill-item {
            background-color: #e9ecef;
            color: #495057;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.2s;
        }

        .skill-item:hover {
            background-color: #0d6efd;
            color: white;
        }
    </style>
</head>

<body>

                <span class="fw-bold text-dark">Tran Duc Minh</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../main/index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../Experience/index.html">Experience</a>
                    </li>
                    <li class="nav-item">

                    </li>
                    <li class="nav-item">

                    </li>
                    <li class="nav-item">

                    <!-- <li class="nav-item">

                    </li> -->
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <section id="skills" class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <div class="card skill-card shadow p-4 p-md-5">
                    <div class="card-body">
                        <h2 class="fw-bold text-dark mb-4 pb-2 section-title" data-key="skills_title">
                            Skills
                        </h2>

                        <div class="d-flex flex-wrap gap-3">
                            <div class="skill-item" data-key="skill_logic">
                                <i class="bi bi-puzzle-fill"></i> Logical and creative thinking
                            </div>

                            <div class="skill-item" data-key="skill_fullstack">
                                <i class="bi bi-layers-fill"></i> Full stack Development
                            </div>

                        </div>

                    </div>
                </div>
            </div>
        </section>
    </main>
